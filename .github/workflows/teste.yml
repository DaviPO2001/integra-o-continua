# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Integração continua

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Inicia Banco de dados
      run: sudo docker compose up -d postgress
    
    - name: Lint
      run: sudo docker run --rm itv $(pwd):app -w /app golangci/golangci-lint golangci run controllers/ database/ models/ routers/

    - name: Test
      run: go test -v main_test.go